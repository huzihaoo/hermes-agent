name: feishu-platform
label: Feishu / Lark
kind: platform
version: 1.0.0
description: >
  Feishu / Lark gateway adapter for Hermes Agent.
  Connects to Feishu (China) or Lark (International) via the official
  lark-oapi SDK over WebSocket or webhook and relays messages between
  Feishu/Lark chats and the Hermes agent. Supports text, images, video,
  voice, documents, threads, DM pairing, group @mention gating, drive
  comment events, and meeting invites.
author: NousResearch
requires_env:
  - name: FEISHU_APP_ID
    description: "Feishu/Lark app ID"
    prompt: "Feishu App ID"
    url: "https://open.feishu.cn/"
    password: false
  - name: FEISHU_APP_SECRET
    description: "Feishu/Lark app secret"
    prompt: "Feishu App Secret"
    url: "https://open.feishu.cn/"
    password: true
optional_env:
  - name: FEISHU_AILY_AUTH_APP_ID
    description: "Feishu caller App ID used by Aily tenant auth or the pinned lark-cli user profile"
    prompt: "Aily auth app ID"
    url: "https://open.feishu.cn/"
    password: false
  - name: FEISHU_AILY_AUTH_APP_SECRET
    description: "Feishu caller App Secret for tenant mode only; user mode keeps OAuth credentials in lark-cli storage"
    prompt: "Aily auth app secret"
    url: "https://open.feishu.cn/"
    password: true
  - name: FEISHU_AILY_TARGET_APP_ID
    description: "Aily platform app ID from aily.feishu.cn used as the knowledge API target (typically spring_...); required when the tool is enabled"
    prompt: "Aily target app ID"
    url: "https://aily.feishu.cn/"
    password: false
  - name: FEISHU_AILY_AGENT_ID
    description: "Aily Agent ID from the agent detail URL (agent_...); required for the Aily Agent Chat tool (permissions aily:agent_chat:write/read)"
    prompt: "Aily Agent ID"
    url: "https://aily.feishu.cn/"
    password: false
  - name: FEISHU_AILY_AUTH_MODE
    description: "Required for Aily Agent: explicit tenant or identity-pinned user auth mode"
    prompt: "Aily Agent auth mode (tenant/user)"
    password: false
  - name: FEISHU_AILY_USER_LARK_CONFIG_DIR
    description: "Absolute 0700 lark-cli config directory used only by Aily Agent user mode"
    prompt: "Aily user lark-cli config directory"
    password: false
  - name: FEISHU_AILY_USER_OPEN_ID
    description: "Pinned app-scoped Feishu open_id allowed to use Aily Agent user mode"
    prompt: "Aily user open_id"
    password: false
  - name: FEISHU_AILY_USER_UNION_ID
    description: "Pinned stable Feishu union_id required from the active Feishu session"
    prompt: "Aily user union_id"
    password: false
  - name: FEISHU_AILY_DOMAIN
    description: "Optional Aily API domain: 'feishu' (China) or 'lark' (International)"
    prompt: "Aily domain (feishu/lark)"
    password: false
  - name: FEISHU_DOMAIN
    description: "Domain: 'feishu' (China) or 'lark' (International)"
    prompt: "Domain (feishu/lark)"
    password: false
  - name: FEISHU_ALLOWED_USERS
    description: "Comma-separated Feishu user IDs allowed to talk to the bot"
    prompt: "Allowed users (comma-separated)"
    password: false
  - name: FEISHU_ALLOW_ALL_USERS
    description: "Allow any Feishu user to trigger the bot (dev only)"
    prompt: "Allow all users? (true/false)"
    password: false
  - name: FEISHU_HOME_CHANNEL
    description: "Default chat ID for cron / notification delivery"
    prompt: "Home channel ID"
    password: false
  - name: FEISHU_HOME_CHANNEL_NAME
    description: "Display name for the Feishu home channel"
    prompt: "Home channel display name"
    password: false
