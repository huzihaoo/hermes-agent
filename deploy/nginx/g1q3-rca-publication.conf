# Include only inside the canonical viewer HTTPS server.
# The VM upstream independently revalidates every path against sealed manifests.
location ^~ /G1Q3_RCA/cases/ {
    autoindex off;

    # Only one content-addressed report bundle and one non-directory asset path
    # shape can reach the manifest-validating upstream.
    if ($request_uri !~ "^/G1Q3_RCA/cases/(?P<rca_report_submission>g1q3-rca-s1-[0-9a-f]{64})/(?P<rca_artifact_set>g1q3-rca-artifact-v1-[0-9a-f]{64})/(?P<rca_report_asset>(?!(?:[.]{1,2})(?:/|$))(?:[A-Za-z0-9._~-]|%[0-9A-Fa-f]{2})+(?:/(?!(?:[.]{1,2})(?:/|$))(?:[A-Za-z0-9._~-]|%[0-9A-Fa-f]{2})+)*)$") { return 404; }

    limit_except GET HEAD OPTIONS {
        deny all;
    }

    proxy_http_version 1.1;
    proxy_pass http://192.168.26.174:18081;
    proxy_set_header Host 192.168.26.174:18081;
    proxy_set_header Connection "";
    proxy_set_header Origin $http_origin;
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_set_header Accept-Encoding "";
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";

    proxy_connect_timeout 3s;
    proxy_send_timeout 10s;
    proxy_read_timeout 60s;
    proxy_buffering off;
    proxy_intercept_errors off;
    proxy_hide_header Server;
}

location ^~ /g1q3-rca-artifacts/ {
    autoindex off;

    if ($request_uri !~ "^/g1q3-rca-artifacts/v1/(?P<rca_viz_submission>g1q3-rca-s1-[0-9a-f]{64})/(?P=rca_viz_submission)[.]viz[.]mcap$") { return 404; }

    limit_except GET HEAD OPTIONS {
        deny all;
    }

    proxy_http_version 1.1;
    proxy_pass http://192.168.26.174:18081;
    proxy_set_header Host 192.168.26.174:18081;
    proxy_set_header Connection "";
    proxy_set_header Origin $http_origin;
    proxy_set_header Range $http_range;
    proxy_set_header If-Range $http_if_range;
    proxy_set_header Accept-Encoding "";
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";

    proxy_connect_timeout 3s;
    proxy_send_timeout 10s;
    proxy_read_timeout 60s;
    proxy_buffering off;
    proxy_intercept_errors off;
    proxy_hide_header Server;
}
